<!DOCTYPE html><html><head><meta charset="utf-8"><title>icon test 2</title></head><body><pre id="o">running…</pre>
<script>
const o = document.getElementById('o');
const strip = n => n.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
const A = n => strip(n).replace(/[^a-z0-9]/g, '');
const B = n => strip(n).replace(/[^a-z0-9-]/g, '');
const noPar = n => n.replace(/\s*\([^)]*\)\s*/g, ' ').trim();
const base = 'https://www.serebii.net/pokemonpokopia/items/';
const test = (url) => new Promise(res => { const i = new Image(); let done = false; const t = setTimeout(() => { if (!done) { done = true; res(-1); } }, 15000); i.onload = () => { if (!done) { done = true; clearTimeout(t); res(i.naturalWidth); } }; i.onerror = () => { if (!done) { done = true; clearTimeout(t); res(0); } }; i.src = url; });
(async () => {
  const d = await (await fetch('data.json')).json();
  const names = d.items.map(it => it.n).filter(n => true);
  const firstMiss = []; let i = 0;
  const w1 = async () => { while (i < names.length) { const n = names[i++]; if (!(await test(base + A(n) + '.png') > 0)) firstMiss.push(n); } };
  await Promise.all(Array.from({ length: 12 }, w1));
  const found = {}, still = []; let j = 0;
  const cands = n => { const p = (n.match(/\(([^)]*)\)/) || [])[1] || ''; const nb = noPar(n); return [...new Set([B(n), B(nb) + (p ? '-' + A(p) : ''), A(nb), B(nb), A(n.replace(/'/g, '')), B(n).replace(/-/g, '_'), A(nb) + A(p), A(p) + A(nb)])].filter(Boolean); };
  const w2 = async () => { while (j < firstMiss.length) { const n = firstMiss[j++]; let hit = null; for (const c of cands(n)) { if (await test(base + c + '.png') > 0) { hit = c; break; } } if (hit) found[n] = hit; else still.push(n); } };
  await Promise.all(Array.from({ length: 12 }, w2));
  o.textContent = 'first pass missing ' + firstMiss.length + '\nFOUND ' + Object.keys(found).length + ' ' + JSON.stringify(found) + '\nSTILL ' + still.length + ' ' + JSON.stringify(still);
})();
</script></body></html>
