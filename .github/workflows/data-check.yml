name: Data check

on:
  schedule:
    - cron: '17 5 * * 3'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Compare data.json with Serebii
        run: python3 tools/data_check.py

      - name: Commit the report
        run: |
          git add "reports/Data check.md"
          if git diff --cached --quiet; then echo "No change"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Data check against Serebii"
          for i in 1 2 3; do
            git pull --rebase --quiet origin "$GITHUB_REF_NAME" && git push origin "HEAD:$GITHUB_REF_NAME" && exit 0
            sleep 5
          done
          exit 1
