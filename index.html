<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Pokopia Area Planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
/* Plan: a surveyor's restoration sheet. Sage paper + ink green, Ditto-lilac accent for the active tool and selection.
   Layout: map canvas fills the screen; tools on top; a side panel on desktop that becomes a bottom sheet on phones. */
:root{
  --paper:#eef1ec; --panel:#f9faf7; --ink:#1c2a23; --muted:#5b6a62; --line:#d3dbd3;
  --accent:#9b55c9; --accent-ink:#ffffff; --accent-soft:#efe2f8;
  --good:#2b8a57; --warn:#b97b0c; --bad:#c2443a;
  --map-bg:#e4e9e2; --map-empty:#dfe5dc; --map-grid:rgba(28,42,35,.08); --map-chunk:rgba(28,42,35,.18);
  --font-display:"Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --font-body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --r:10px; --sheet-h:72px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#121815; --panel:#18201c; --ink:#e4ece6; --muted:#93a39a; --line:#2b3631;
    --accent:#c393ea; --accent-ink:#1b1022; --accent-soft:#2c2338;
    --good:#4cc283; --warn:#e3a93a; --bad:#ef6d60;
    --map-bg:#0f1512; --map-empty:#1a221e; --map-grid:rgba(228,236,230,.06); --map-chunk:rgba(228,236,230,.14);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#121815; --panel:#18201c; --ink:#e4ece6; --muted:#93a39a; --line:#2b3631;
  --accent:#c393ea; --accent-ink:#1b1022; --accent-soft:#2c2338;
  --good:#4cc283; --warn:#e3a93a; --bad:#ef6d60;
  --map-bg:#0f1512; --map-empty:#1a221e; --map-grid:rgba(228,236,230,.06); --map-chunk:rgba(228,236,230,.14);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.4;overflow:hidden;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{display:grid;grid-template-rows:auto auto 1fr;height:100%}

/* header */
.top{display:flex;align-items:center;gap:12px;padding:8px 16px;border-bottom:1px solid var(--line);min-width:0}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand svg{flex:none}
.brand h1{font-family:var(--font-display);font-weight:800;font-size:19px;letter-spacing:-.01em;margin:0;white-space:nowrap}
.brand h1 span{color:var(--accent)}
.top .fsbtn{width:36px;height:36px;border-radius:10px;box-shadow:none;flex:none}
.top .fsbtn[hidden]{display:none}
.planpick{display:flex;align-items:center;gap:6px;min-width:0;flex:1;justify-content:flex-end}
.planname{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:40vw}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:3px 10px;font-size:12.5px;white-space:nowrap}
.chip.good{border-color:color-mix(in srgb,var(--good) 40%,var(--line));color:var(--good)}
.chip.warn{border-color:color-mix(in srgb,var(--warn) 40%,var(--line));color:var(--warn)}
.chip.bad{border-color:color-mix(in srgb,var(--bad) 40%,var(--line));color:var(--bad)}
.dot{width:8px;height:8px;border-radius:50%;background:currentColor;flex:none}

/* toolbar */
.toolbar{display:flex;gap:4px;padding:6px 12px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none;align-items:center}
.toolbar::-webkit-scrollbar{display:none}
.tbtn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-width:54px;height:50px;padding:4px 6px;border:1px solid transparent;background:none;border-radius:var(--r);color:var(--ink);font-size:11.5px;flex:none}
.tbtn svg{width:22px;height:22px}
.tbtn:hover{background:color-mix(in srgb,var(--ink) 6%,transparent)}
.tbtn[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.tbtn:disabled{opacity:.35;cursor:default}
.sep{width:1px;height:32px;background:var(--line);margin:0 4px;flex:none}

/* main */
.main{position:relative;display:grid;grid-template-columns:1fr 400px;min-height:0}
.mapwrap{position:relative;min-height:0;overflow:hidden;background:var(--map-bg)}
#map{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
.optbar{position:absolute;top:8px;left:8px;right:8px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;pointer-events:none}
.optbar > *{pointer-events:auto}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:4px 6px 4px 10px;font-size:13px;box-shadow:0 2px 8px rgba(0,0,0,.08);max-width:100%}
.pill .lbl{color:var(--muted)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--panel)}
.seg button{border:0;background:none;padding:4px 10px;font-size:12.5px}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--ink);font-weight:700}
.swatch{width:20px;height:20px;border-radius:6px;flex:none;background-size:cover;image-rendering:auto}
.status{position:absolute;left:8px;bottom:calc(8px);display:flex;gap:6px;align-items:center;font-size:12.5px;color:var(--muted);pointer-events:none;flex-wrap:wrap}
.status .chip{pointer-events:none}
.zoomctl{position:absolute;right:8px;bottom:8px;display:flex;flex-direction:column;gap:6px}
.iconbtn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--panel);display:grid;place-items:center;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.iconbtn svg{width:20px;height:20px}
.iconbtn[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.arealine{display:flex;gap:8px;align-items:flex-start;margin-top:8px;padding:8px 10px;border-radius:10px;background:color-mix(in srgb,var(--ink) 5%,transparent);font-size:13px}
.arealine svg{width:18px;height:18px;flex:none;margin-top:1px;color:var(--accent)}

/* inspector card */
.inspector{position:absolute;left:8px;bottom:44px;width:min(380px,calc(100% - 64px));background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:0 8px 28px rgba(0,0,0,.16);display:none;flex-direction:column;max-height:calc(100% - 104px);overflow:hidden}
.inspector.open{display:flex}
.insp-top{flex:none;padding:12px 14px 10px}
.insp-acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.insp-acts:empty{display:none}
.insp-acts .btn.sm{padding:7px 11px;font-size:13px}
.insp-body{flex:1 1 auto;min-height:0;overflow:auto;overscroll-behavior:contain;padding:2px 14px 14px;border-top:1px solid var(--line)}
.insp-body:empty{display:none}
.insp-body>:first-child{margin-top:10px}
.inspector.min .insp-body{display:none}
.insp-min svg{transition:transform .15s}
.inspector.min .insp-min svg{transform:rotate(180deg)}
.insp-head .close + .close{margin-left:0}
.choice{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.choice .btn{justify-content:flex-start;text-align:left;padding:10px 12px;flex-direction:column;align-items:flex-start;gap:2px}
.choice .btn .note{font-weight:400}
.toast.act{pointer-events:auto}
.pic{display:block;width:64px;height:64px;border-radius:12px;object-fit:contain;background:#e9ebe6}
.pic.big{width:132px;height:132px;margin:2px auto 10px;border-radius:16px}
.szgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px;margin-top:10px}
.szcard{border:1px solid var(--line);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:6px;align-items:center;text-align:center;background:var(--paper)}
.szcard .pic{width:96px;height:96px}
.szcard .nm{font-weight:700;font-size:13.5px;line-height:1.25}
.szcard.mine{border-color:color-mix(in srgb,var(--good) 55%,var(--line))}
.szcard.guess .cur{color:var(--warn)}
.szbtns{display:flex;flex-wrap:wrap;gap:4px;justify-content:center}
.szbtns button{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:5px 8px;font-size:13px;font-weight:700;font-variant-numeric:tabular-nums;min-width:40px}
.szbtns button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.szother{display:flex;gap:4px;align-items:center;justify-content:center}
.szother input{width:52px;border:1px solid var(--line);border-radius:8px;padding:4px 6px;background:var(--panel);text-align:center}
.toast button{border:0;background:none;color:inherit;font:inherit;font-weight:800;text-decoration:underline;text-underline-offset:3px;margin-left:12px;padding:2px 4px}
.inspector h3{margin:0 0 2px;font-family:var(--font-display);font-size:17px;text-wrap:balance}
.insp-head{display:flex;gap:10px;align-items:flex-start}
.insp-head .swatch{width:34px;height:34px;border-radius:9px}
.close{margin-left:auto;border:0;background:none;padding:4px;border-radius:8px;color:var(--muted)}
.close svg{width:18px;height:18px}

/* panel */
.panel{border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0;background:var(--panel)}
.handle{display:none}
.tabs{display:flex;border-bottom:1px solid var(--line);flex:none}
.tab{flex:1;border:0;background:none;padding:12px 4px 10px;font-size:13px;font-weight:700;color:var(--muted);border-bottom:3px solid transparent;display:flex;flex-direction:column;align-items:center;gap:3px}
.tab svg{width:18px;height:18px}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tabbody{overflow:auto;flex:1;padding:14px 16px 24px;min-height:0;overscroll-behavior:contain}
.tabbody[hidden]{display:none}
h2{font-family:var(--font-display);font-weight:800;font-size:20px;letter-spacing:-.01em;margin:0 0 4px;text-wrap:balance}
h4{font-family:var(--font-display);font-weight:600;font-size:15px;margin:18px 0 8px}
.sub{color:var(--muted);font-size:13px;margin:0 0 10px}
.search{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:12px;padding:8px 10px;background:var(--paper)}
.search input{border:0;background:none;outline:none;flex:1;min-width:0}
.search svg{width:18px;height:18px;color:var(--muted);flex:none}
.cats{display:flex;gap:6px;overflow-x:auto;padding:10px 0 8px;scrollbar-width:thin}
.cat{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:5px 11px;font-size:13px;white-space:nowrap;flex:none}
.cat[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.cat .n{color:var(--muted);font-size:11.5px;margin-left:4px}
.cat[aria-pressed="true"] .n{color:inherit;opacity:.7}
.list{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:10px;padding:7px 6px;border-radius:10px;border:1px solid transparent;text-align:left;background:none;width:100%}
.row:hover{background:color-mix(in srgb,var(--ink) 5%,transparent)}
.row[aria-pressed="true"]{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 45%,transparent)}
.row .swatch{width:30px;height:30px;border-radius:8px}
img.swatch{display:block;object-fit:cover}
.row .meta{min-width:0;flex:1}
.row .nm{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .ds{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.info{border:0;background:none;color:var(--muted);padding:6px;border-radius:8px;flex:none}
.info svg{width:18px;height:18px}
.ep{font-size:10.5px;font-weight:700;letter-spacing:.04em;border-radius:5px;padding:1px 5px;background:color-mix(in srgb,var(--accent) 18%,transparent);color:var(--accent);vertical-align:1px}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:8px 0 4px}
.tile{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--paper)}
.tile .k{font-size:12px;color:var(--muted)}
.tile .v{font-family:var(--font-display);font-weight:800;font-size:22px;font-variant-numeric:tabular-nums}
.tile .v small{font-size:13px;color:var(--muted);font-weight:600}
table.mats{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:14px}
table.mats th{font-size:12px;color:var(--muted);font-weight:700;text-align:right;padding:6px 4px;border-bottom:1px solid var(--line)}
table.mats th:first-child{text-align:left}
table.mats td{padding:6px 4px;border-bottom:1px solid color-mix(in srgb,var(--line) 70%,transparent);text-align:right}
table.mats td:first-child{text-align:left}
table.mats input{width:62px;text-align:right;border:1px solid var(--line);border-radius:8px;padding:3px 6px;background:var(--paper)}
.left0{color:var(--good);font-weight:700}
.leftn{color:var(--ink);font-weight:700}
.reqs{display:flex;flex-wrap:wrap;gap:5px;margin:6px 0}
.req{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;border-radius:8px;padding:3px 8px;background:var(--paper);border:1px solid var(--line)}
.req b{font-variant-numeric:tabular-nums}
.req.ok{border-color:color-mix(in srgb,var(--good) 45%,var(--line));background:color-mix(in srgb,var(--good) 10%,var(--paper))}
.req.miss{border-color:color-mix(in srgb,var(--bad) 40%,var(--line));background:color-mix(in srgb,var(--bad) 8%,var(--paper))}
.card{border:1px solid var(--line);border-radius:14px;padding:11px 12px;margin:0 0 8px;background:var(--panel)}
.card.zone-ok{border-left:4px solid var(--good)}
.card.zone-part{border-left:4px solid var(--warn)}
.card.zone-none{border-left:4px solid var(--line)}
.card .hd{display:flex;align-items:baseline;gap:8px}
.card .no{font-variant-numeric:tabular-nums;color:var(--muted);font-size:12.5px;font-weight:700}
.card .title{font-weight:700}
.card .acts{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.mons{font-size:13px;color:var(--muted)}
.mons button{border:0;background:none;padding:0;color:var(--ink);text-decoration:underline;text-decoration-color:color-mix(in srgb,var(--ink) 30%,transparent);text-underline-offset:2px;font-size:13px}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:7px 12px;font-size:13.5px;font-weight:700;display:inline-flex;align-items:center;gap:6px}
.btn svg{width:16px;height:16px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--bad)}
.btn.sm{padding:4px 9px;font-size:12.5px;border-radius:8px}
.spec{display:inline-block;font-size:11.5px;font-weight:700;border-radius:6px;padding:1px 6px;margin:1px 2px 1px 0;background:color-mix(in srgb,var(--ink) 8%,transparent)}
.coverage{display:flex;flex-wrap:wrap;gap:6px}
.cov{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:10px;padding:5px 9px;font-size:13px;background:var(--paper)}
.cov b{font-variant-numeric:tabular-nums}
.cov.need{border-color:color-mix(in srgb,var(--bad) 45%,var(--line))}
.cov.have{border-color:color-mix(in srgb,var(--good) 45%,var(--line))}
.field{display:flex;flex-direction:column;gap:4px;margin:0 0 10px}
.field label{font-size:12.5px;color:var(--muted);font-weight:700}
.field input,.field select{border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--paper)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.note{font-size:12.5px;color:var(--muted)}
.toggle{display:flex;align-items:center;gap:8px;font-size:13.5px}
.empty{color:var(--muted);font-size:14px;padding:12px 4px}
a{color:var(--accent)}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:9px 16px;border-radius:999px;font-size:14px;font-weight:700;box-shadow:0 8px 24px rgba(0,0,0,.25);opacity:0;transition:opacity .2s;pointer-events:none;z-index:50;max-width:90vw;text-align:center}
.toast.on{opacity:1}
.modal{position:fixed;inset:0;background:rgba(10,15,12,.45);display:none;align-items:center;justify-content:center;z-index:40;padding:16px}
.modal.open{display:flex}
.modal .box{background:var(--panel);border-radius:16px;padding:16px 18px;width:min(420px,100%);max-height:85vh;overflow:auto;box-shadow:0 20px 50px rgba(0,0,0,.3)}
.modal .box .acts{display:flex;gap:8px;justify-content:flex-end;margin-top:12px}
.hint{border:1px dashed color-mix(in srgb,var(--accent) 50%,var(--line));background:color-mix(in srgb,var(--accent) 6%,transparent);border-radius:12px;padding:10px 12px;font-size:13.5px}
kbd{font-family:inherit;font-size:12px;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:0 5px;background:var(--paper)}
.srcs li{margin:0 0 4px;font-size:13px}
.section{border-top:1px solid var(--line);margin-top:10px;padding-top:10px}
.res{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:3px 4px 3px 10px;font-size:13px;font-weight:700;background:var(--paper)}
.res button{border:0;background:none;padding:2px;border-radius:50%;color:var(--muted);display:grid;place-items:center}
.res button svg{width:14px;height:14px}
.env{display:inline-block;font-size:11px;font-weight:700;border-radius:5px;padding:1px 6px;background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--ink);white-space:nowrap}
.fav{display:inline-flex;align-items:center;gap:4px;font-size:12px;border-radius:7px;padding:2px 7px;border:1px solid var(--line);margin:2px 3px 2px 0;background:var(--paper)}
.fav.have{border-color:color-mix(in srgb,var(--good) 50%,var(--line));background:color-mix(in srgb,var(--good) 12%,var(--paper))}
.fav.want{border-color:color-mix(in srgb,var(--warn) 45%,var(--line))}
.modal .box.wide{width:min(560px,100%)}
.modal .box.xl{width:min(980px,100%);max-height:90vh}
.grpctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.grpctl .pill{box-shadow:none}
.grpsum{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;margin:12px 0 10px;padding:9px 12px;border-radius:12px;background:color-mix(in srgb,var(--accent) 8%,transparent);font-size:13.5px}
.ggrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:10px}
.ggrid .field select{padding:6px 8px;font-size:13px}
button.res{cursor:pointer}
.szb{display:inline-block;font-size:10.5px;font-weight:800;border-radius:5px;padding:1px 5px;margin-left:4px;background:color-mix(in srgb,var(--ink) 9%,transparent);color:var(--muted);vertical-align:1px;white-space:nowrap}
.szb.big{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.szb.guess{background:transparent;outline:1px dashed color-mix(in srgb,currentColor 55%,transparent);outline-offset:-1px}
button.szb.edit{border:0;font:inherit;font-size:10.5px;font-weight:800;line-height:1.5;cursor:pointer}
.res.bad{border-color:color-mix(in srgb,var(--bad) 55%,var(--line));background:color-mix(in srgb,var(--bad) 8%,var(--paper))}

/* decorating a kit house: a large popup with the room on the left and help on the right */
.ied{position:fixed;inset:0;background:rgba(10,15,12,.5);z-index:35;display:flex;align-items:center;justify-content:center;padding:18px}
.ied[hidden]{display:none}
.ied .win{position:relative;background:var(--panel);border-radius:18px;width:min(1240px,100%);height:min(820px,100%);display:grid;grid-template-rows:auto 1fr;box-shadow:0 24px 60px rgba(0,0,0,.35);overflow:hidden}
.ied .whead{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.ied .whead .ttl{min-width:0}
.ied .whead .ctrls{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-left:auto}
.ied .whead .close{margin-left:0}
.ied .seg button{padding:6px 12px;font-size:13px}
.ied .seg .n{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
.ied .iconbtn.sm{width:34px;height:34px;border-radius:10px;box-shadow:none}
.ied .iconbtn:disabled{opacity:.35;cursor:default}
.swatch.big{width:38px;height:38px;border-radius:10px}
.ied .wbody{display:grid;grid-template-columns:minmax(0,1fr) 380px;min-height:0}
.ied .stage{display:flex;flex-direction:column;min-height:0;min-width:0;padding:12px;gap:10px}
.ied .canvasbox{flex:1;min-height:0;display:grid;place-items:center;background:var(--map-bg);border-radius:14px;overflow:hidden}
.ied canvas{display:block;touch-action:none;cursor:crosshair;border-radius:8px;box-shadow:0 6px 18px rgba(0,0,0,.18)}
.ied .foot{display:flex;align-items:center;gap:10px;min-height:38px;font-size:13.5px;flex-wrap:wrap}
.ied .foot .swatch{width:28px;height:28px;border-radius:8px}
.ied .foot .grow{flex:1;min-width:0}
.ied .side{border-left:1px solid var(--line);overflow:auto;padding:14px 16px 24px;overscroll-behavior:contain}
.ied .side h4:first-child{margin-top:0}
.ied button.fav{cursor:pointer}
.ied button.fav[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.res .flr{font-size:10.5px;font-weight:800;border-radius:6px !important;padding:1px 5px !important;background:var(--accent-soft) !important;color:var(--ink) !important;margin-left:-4px}
@media (max-width: 899px){
  .ied{padding:0}
  .ied .win{height:100%;border-radius:0}
  .ied .wbody{grid-template-columns:1fr;grid-template-rows:minmax(240px,46%) 1fr}
  .ied .side{border-left:0;border-top:1px solid var(--line)}
  .ied .whead{padding:10px 48px 10px 12px;gap:8px}
  .ied .whead .close{position:absolute;top:8px;right:8px}
  .ied .whead .ctrls{margin-left:0}
  .ied .whead h2{font-size:17px}
  .ied .foot .tip{display:none}
  .ied .stage{padding:8px;gap:6px}
}

@media (max-width: 899px){
  .main{grid-template-columns:1fr}
  .panel{position:absolute;left:0;right:0;bottom:0;height:var(--sheet-h);border-left:0;border-top:1px solid var(--line);border-radius:18px 18px 0 0;box-shadow:0 -10px 30px rgba(0,0,0,.14);transition:height .22s ease;z-index:20}
  .panel.dragging{transition:none}
  .handle{display:block;height:16px;flex:none;position:relative;cursor:grab;border:0;background:none;width:100%;touch-action:none;user-select:none}
  .handle::after{content:"";position:absolute;left:50%;top:6px;width:44px;height:5px;border-radius:5px;background:var(--muted);opacity:.5;transform:translateX(-50%)}
  .tabs{touch-action:none;user-select:none}
  .tab{padding:6px 2px 8px;font-size:11.5px}
  .status{bottom:calc(var(--sheet-h) + 8px);transition:bottom .22s ease}
  .zoomctl{bottom:calc(var(--sheet-h) + 8px);transition:bottom .22s ease}
  .sheetdrag .status,.sheetdrag .zoomctl{transition:none}
  .inspector{bottom:calc(var(--sheet-h) + 44px);width:calc(100% - 64px);max-height:calc(100% - var(--sheet-h) - 96px)}
  .top{padding:6px 12px}
  .brand h1{font-size:16px}
  .planname{max-width:34vw}
  .hide-sm{display:none}
}
@media (max-width: 899px){ .toast{bottom:calc(var(--sheet-h) + 64px)} html[data-sheet="full"] .toast{bottom:28px} }
@media (max-width: 599px){ .brand h1{display:none} .planname{max-width:46vw} }
@media (prefers-reduced-motion: reduce){ .panel,.status,.zoomctl{transition:none} .toast{transition:none} }

let updateWanted = false;
const swReg = () => 'serviceWorker' in navigator ? navigator.serviceWorker.getRegistration().catch(() => null) : Promise.resolve(null);
function checkForUpdate() { if (navigator.onLine) swReg().then(r => r && r.update()).catch(() => { }); }
function appVersion() { const d = new Date(APP_BUILD); return isNaN(d) ? APP_BUILD : d.toLocaleString('en-GB', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }); }
async function updateNow() {
  const reg = await swReg(); if (!reg) { location.reload(); return; }
  if (!navigator.onLine) { toast('You\'re offline. Connect to the internet to check for updates.'); return; }
  toast('Checking for updates…', 8000); updateWanted = true;
  try { await reg.update(); } catch (e) { updateWanted = false; toast('Couldn\'t reach the planner\'s website. Try again in a moment.'); return; }
  if (reg.installing || reg.waiting) { toast('Updating…', 15000); setTimeout(() => { if (updateWanted) location.reload(); }, 15000); }
  else { updateWanted = false; toast('You have the latest version (' + appVersion() + ').'); }
}
/* ============================== boot ============================== */
async function boot() {
  readTheme(); resize(); requestAnimationFrame(loop); fsInit();
  if ('serviceWorker' in navigator && document.querySelector('link[rel="manifest"]') && /^https?:$/.test(location.protocol)) {
    const hadController = !!navigator.serviceWorker.controller; let pending = false;
    const reloadNow = () => { try { persistNow(); } catch (e) { } location.reload(); };
    navigator.serviceWorker.register('sw.js').then(r => { r.update().catch(() => { }); }).catch(() => { });
    navigator.serviceWorker.addEventListener('controllerchange', () => { if (!hadController || pending) return; pending = true; if (updateWanted) { reloadNow(); return; } toast('A new version of the planner is ready.', 10000, { label: 'Open it', fn: reloadNow }); });
    document.addEventListener('visibilitychange', () => { if (document.visibilityState !== 'visible') return; if (pending) reloadNow(); else checkForUpdate(); });
    setInterval(checkForUpdate, 30 * 60 * 1000);
  }
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change', readTheme);
  new MutationObserver(readTheme).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
  new ResizeObserver(() => { resize(); }).observe($('#mapwrap'));
  const picsReq = fetch('pics/index.json').then(r => r.ok ? r.json() : null).catch(() => null);
  let d;
  try { const emb = document.getElementById('pokopiaData'); if (emb) d = JSON.parse(emb.textContent); else { const r = await fetch('data.json'); if (!r.ok) throw new Error(r.status); d = await r.json(); } }
  catch (e) { $('#hdrPlan').textContent = 'Could not load game data'; toast('Game data failed to load. Reload the page to try again.', 6000); return; }
  buildIndex(d);
  const pj = await picsReq; if (pj && pj.pics) { PICS = { pics: pj.pics, missing: pj.missing || {}, top: pj.top || {}, bytes: pj.bytes || 0 }; picOf.length = 0; }
  loadLocalPlans();
  const cur = LS.get(LSK + 'current'); let p = cur ? readLocalPlan(cur) : null;
  if (!p && plansIndex.length) p = readLocalPlan(plansIndex[plansIndex.length - 1].id);
  if (!p) { p = makeExample(); exampleUntouched = true; LS.set(LSK + 'example', p.id + ':' + p.updated); }
  installPlan(p); if (!LS.get(LSK + 'plan:' + p.id)) persistNow(); else setSave('local');
  selectItem('Field grass', false); setTool('place'); setShowAreas(showAreas);
  showTab(VALID_TABS.includes(location.hash.slice(1)) ? location.hash.slice(1) : 'build', true);
  if (innerWidth < 900) setSheet('peek');
  initCapabilities();
  setTimeout(() => fillPictures(), 1500);
  const startSync = () => { if (syncOn() && !fbLoading) loadFirebase().catch(() => { if (navigator.onLine) { syncErr = 'Couldn\'t load Google sign-in. Trying again when the connection changes.'; syncUI(); } }); };
  startSync();
  addEventListener('online', () => { if (picFill.done < picFill.total) fillPictures(); startSync(); syncErr = ''; scheduleSync(500); syncUI(); });
  addEventListener('offline', () => { syncSettled(); });
  const leaving = () => { if (dirty) persistNow(true); if (syncOn() && syncPending()) reconcile(); };
  addEventListener('pagehide', leaving);
  document.addEventListener('visibilitychange', () => { if (document.hidden) leaving(); else syncUI(); });
}
boot();
