<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<style>
:root{
  --paper:#eef1ec; --panel:#f9faf7; --ink:#1c2a23; --muted:#5b6a62; --line:#d3dbd3;
  --accent:#9b55c9; --accent-ink:#ffffff; --accent-soft:#efe2f8;
  --good:#2b8a57; --warn:#b97b0c; --bad:#c2443a;
  --map-bg:#e4e9e2; --map-empty:#dfe5dc; --map-grid:rgba(28,42,35,.08); --map-chunk:rgba(28,42,35,.18);
  --font-display:"Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --font-body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --r:10px; --sheet-h:64px; --sheet-full:64px; --ease:cubic-bezier(.2,.8,.2,1); --ease-sheet:cubic-bezier(.32,.72,0,1);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#121815; --panel:#18201c; --ink:#e4ece6; --muted:#93a39a; --line:#2b3631;
    --accent:#c393ea; --accent-ink:#1b1022; --accent-soft:#2c2338;
    --good:#4cc283; --warn:#e3a93a; --bad:#ef6d60;
    --map-bg:#0f1512; --map-empty:#1a221e; --map-grid:rgba(228,236,230,.06); --map-chunk:rgba(228,236,230,.14);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#121815; --panel:#18201c; --ink:#e4ece6; --muted:#93a39a; --line:#2b3631;
  --accent:#c393ea; --accent-ink:#1b1022; --accent-soft:#2c2338;
  --good:#4cc283; --warn:#e3a93a; --bad:#ef6d60;
  --map-bg:#0f1512; --map-empty:#1a221e; --map-grid:rgba(228,236,230,.06); --map-chunk:rgba(228,236,230,.14);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--font-body);font-size:14.5px;line-height:1.38;overflow:hidden;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{display:grid;grid-template-rows:auto auto 1fr;height:100%;overflow:hidden}
.btn,.tbtn,.iconbtn,.cat,.tab,.row,.seg button,.szbtns button,.req,.cov,.fav,.info,.close{transition:background-color .16s,border-color .16s,color .16s,box-shadow .16s,transform .12s var(--ease)}
.btn:active,.tbtn:active,.iconbtn:active,.cat:active,.seg button:active,.szbtns button:active,.close:active,.info:active{transform:scale(.95)}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.98)}}
@keyframes fade{from{opacity:0}}

.top{display:flex;align-items:center;gap:10px;padding:6px 14px;border-bottom:1px solid var(--line);min-width:0}
.brand{display:flex;align-items:center;gap:8px;min-width:0}
.brand svg{flex:none;width:26px;height:26px}
.brand h1{font-family:var(--font-display);font-weight:800;font-size:18px;letter-spacing:-.01em;margin:0;white-space:nowrap}
.brand h1 span{color:var(--accent)}
.top .fsbtn{width:34px;height:34px;border-radius:10px;box-shadow:none;flex:none}
.top .fsbtn[hidden]{display:none}
.planpick{display:flex;align-items:center;gap:6px;min-width:0;flex:1;justify-content:flex-end}
.planname{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:40vw}
.chip{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:2px 9px;font-size:12px;white-space:nowrap;transition:color .2s,border-color .2s}
.chip.good{border-color:color-mix(in srgb,var(--good) 40%,var(--line));color:var(--good)}
.chip.warn{border-color:color-mix(in srgb,var(--warn) 40%,var(--line));color:var(--warn)}
.chip.bad{border-color:color-mix(in srgb,var(--bad) 40%,var(--line));color:var(--bad)}
.dot{width:8px;height:8px;border-radius:50%;background:currentColor;flex:none}

.toolbar{display:flex;gap:2px;padding:3px 10px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none;align-items:center}
.toolbar::-webkit-scrollbar{display:none}
.tbtn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;min-width:48px;height:44px;padding:3px 5px;border:1px solid transparent;background:none;border-radius:var(--r);color:var(--ink);font-size:11px;flex:none}
.tbtn svg{width:20px;height:20px}
.tbtn:hover{background:color-mix(in srgb,var(--ink) 6%,transparent)}
.tbtn[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.tbtn:disabled{opacity:.35;cursor:default}
.tbtn.icononly{min-width:44px}
.sep{width:1px;height:28px;background:var(--line);margin:0 4px;flex:none}

.main{position:relative;display:grid;grid-template-columns:1fr var(--pw,380px);min-height:0}
:root[data-pw="narrow"]{--pw:320px}
:root[data-pw="wide"]{--pw:460px}
@media (min-width: 900px){ :root[data-side="left"] .main{grid-template-columns:var(--pw,380px) 1fr} :root[data-side="left"] .panel{order:-1;border-left:0;border-right:1px solid var(--line)} }
.mapwrap{position:relative;min-height:0;overflow:hidden;background:var(--map-bg)}
#map{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
#map3d{position:absolute;inset:0;width:100%;height:100%;display:block}
#map3d[hidden],.zoomctl [hidden]{display:none}
@media (max-height:600px){.mapwrap .zoomctl{flex-direction:row;flex-wrap:wrap-reverse;justify-content:flex-end;max-width:calc(100% - 12px)}}
.optbar{position:absolute;top:6px;left:6px;right:6px;display:flex;flex-wrap:wrap;gap:5px;align-items:center;pointer-events:none}
.optbar > *{pointer-events:auto}
.pill{display:inline-flex;align-items:center;gap:5px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:3px 5px 3px 9px;font-size:12.5px;box-shadow:0 2px 8px rgba(0,0,0,.08);max-width:100%}
.pill .lbl{color:var(--muted)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--panel)}
.seg button{border:0;background:none;padding:3px 9px;font-size:12.5px}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--ink);font-weight:700}
.seg button.segi{display:grid;place-items:center}
.seg button.segi svg{width:17px;height:17px;display:block}
.swatch{width:20px;height:20px;border-radius:6px;flex:none;background-size:cover;image-rendering:auto}
.status[hidden]{display:none}
.status{position:absolute;left:6px;bottom:6px;display:flex;gap:5px;align-items:center;font-size:12px;color:var(--muted);pointer-events:none;flex-wrap:wrap}
.status .chip{pointer-events:none}
.zoomctl{position:absolute;right:6px;bottom:6px;display:flex;flex-direction:column;gap:5px}
.iconbtn{width:38px;height:38px;border-radius:11px;border:1px solid var(--line);background:var(--panel);display:grid;place-items:center;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.iconbtn svg{width:19px;height:19px}
.iconbtn[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.iconbtn{position:relative}
.sysw{position:relative;display:block}
.sysmenu{position:absolute;right:46px;bottom:0;width:min(290px,calc(100vw - 70px));background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 28px rgba(0,0,0,.18);padding:6px;z-index:8}
.sysmenu[hidden]{display:none}
.sysmenu .shd{font-size:12px;font-weight:700;color:var(--muted);padding:4px 8px 2px}
.sysmenu .mi{display:flex;gap:10px;align-items:flex-start;width:100%;padding:8px;border:0;border-radius:8px;background:none;text-align:left;color:inherit;font:inherit;cursor:pointer}
.sysmenu .mi:hover,.sysmenu .mi:focus-visible{background:color-mix(in srgb,var(--accent) 10%,transparent)}
.sysmenu .ck{flex:none;width:18px;height:18px;margin-top:1px;border-radius:5px;border:2px solid var(--line);display:grid;place-items:center}
.sysmenu .mi[aria-checked="true"] .ck{background:var(--accent);border-color:var(--accent)}
.sysmenu .mi[aria-checked="true"] .ck::after{content:"";width:8px;height:4px;border:2px solid var(--accent-ink);border-top:0;border-right:0;transform:translateY(-1px) rotate(-45deg)}
.sysmenu .mt{display:block;font-weight:700;font-size:14px}
.sysmenu .md{display:block;font-size:12px;color:var(--muted);margin-top:1px}
@media (max-width:600px),(max-height:600px){.sysmenu .mi{padding:6px}.sysmenu .md{font-size:11.5px;line-height:1.3}}
.sysmenu.compact .md{display:none}.sysmenu.compact .mi{padding:7px 8px}
.sysmenu kbd{font:inherit;font-size:11px;border:1px solid var(--line);border-radius:4px;padding:0 4px;margin-left:6px;color:var(--muted)}
.status .chip.act{pointer-events:auto;cursor:pointer;font:inherit;font-size:12px}
.iconbtn.dot::after{content:"";position:absolute;top:5px;right:5px;width:8px;height:8px;border-radius:50%;background:var(--warn);box-shadow:0 0 0 2px var(--panel)}
.lvsel{border:0;background:none;font-weight:700;font-size:12.5px;padding:2px 0;max-width:120px;cursor:pointer}
.lvsel:focus-visible{outline-offset:0}
.lyr{display:flex;align-items:center;gap:2px;min-width:0}
.lyr .row{flex:1;min-width:0}
.lyr.off .row,.lyr.off .eye{opacity:.5}
.lyr .eye{border:0;background:none;color:var(--ink);width:40px;height:40px;border-radius:10px;display:grid;place-items:center;flex:none;padding:0}
.lyr .eye svg{width:20px;height:20px}
.lyr .eye:hover{background:color-mix(in srgb,var(--ink) 6%,transparent)}
.lyr .gap{width:40px;flex:none}
.lvl{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;font-weight:800;font-size:13px;font-variant-numeric:tabular-nums;flex:none;background:var(--paper);border:1px solid var(--line);color:var(--ink)}
.lvl svg{width:17px;height:17px}
.row[aria-pressed="true"] .lvl{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.lyrfoot{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:10px 4px 0}
.lyrfoot .pill{box-shadow:none}
.lyrgap{font-size:12px;color:var(--muted);padding:3px 0 3px 22px;border-left:2px dotted var(--line);margin-left:61px}
.lvgo{display:flex;gap:6px;align-items:center}
.lvgo input{flex:1;text-align:center;font-weight:700;font-size:16px}
.arealine{display:flex;gap:7px;align-items:flex-start;margin-top:6px;padding:6px 9px;border-radius:9px;background:color-mix(in srgb,var(--ink) 5%,transparent);font-size:12.5px}
.arealine svg{width:16px;height:16px;flex:none;margin-top:1px;color:var(--accent)}

.inspector{position:absolute;left:6px;bottom:40px;width:min(370px,calc(100% - 58px));background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:0 8px 28px rgba(0,0,0,.16);display:none;flex-direction:column;max-height:calc(100% - 96px);overflow:hidden;transform-origin:left bottom}
.inspector.open{display:flex;animation:pop .22s var(--ease)}
.minidlg{position:absolute;left:56px;right:56px;bottom:8px;display:flex;justify-content:center;pointer-events:none;z-index:7}
.minidlg[hidden]{display:none}
.minidlg .in{pointer-events:auto;display:flex;align-items:center;gap:7px;max-width:100%;background:var(--panel);border:1.5px solid var(--accent);border-radius:14px;padding:5px 5px 5px 10px;box-shadow:0 8px 24px rgba(0,0,0,.18);animation:pop .22s var(--ease)}
.minidlg .in>svg{width:18px;height:18px;color:var(--accent);flex:none}
.minidlg .mt{display:flex;flex-direction:column;min-width:0;line-height:1.25}
.minidlg .mt b{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.minidlg .mt small{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.insp-top{flex:none;padding:10px 12px 8px}
.insp-acts{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}
.insp-acts:empty{display:none}
.insp-acts .btn.sm{padding:6px 10px;font-size:12.5px}
.insp-body{flex:1 1 auto;min-height:0;overflow:auto;overscroll-behavior:contain;padding:2px 12px 12px;border-top:1px solid var(--line)}
.insp-body:empty{display:none}
.insp-body>:first-child{margin-top:8px}
.inspector.min .insp-body{display:none}
.insp-min svg{transition:transform .2s var(--ease)}
.inspector.min .insp-min svg{transform:rotate(180deg)}
.insp-head .close + .close{margin-left:0}
.choice{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.choice .btn{justify-content:flex-start;text-align:left;padding:8px 11px;flex-direction:column;align-items:flex-start;gap:2px}
.choice .btn .note{font-weight:400}
.pic{display:block;width:64px;height:64px;border-radius:12px;object-fit:contain;background:#e9ebe6}
.pic.big{width:112px;height:112px;margin:0 auto 8px;border-radius:14px}
.szgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px;margin-top:8px}
.szcard{border:1px solid var(--line);border-radius:12px;padding:8px;display:flex;flex-direction:column;gap:5px;align-items:center;text-align:center;background:var(--paper)}
.szcard .pic{width:80px;height:80px}
.szcard .nm{font-weight:700;font-size:13px;line-height:1.2}
.szcard.mine{border-color:color-mix(in srgb,var(--good) 55%,var(--line))}
.szcard.guess .cur{color:var(--warn)}
.szbtns{display:flex;flex-wrap:wrap;gap:4px;justify-content:center}
.szbtns button{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:4px 7px;font-size:12.5px;font-weight:700;font-variant-numeric:tabular-nums;min-width:40px}
.szbtns button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.szother{display:flex;gap:4px;align-items:center;justify-content:center}
.szother input{width:52px;border:1px solid var(--line);border-radius:8px;padding:4px 6px;background:var(--panel);text-align:center}
.toast button{border:0;background:none;color:inherit;font:inherit;font-weight:800;text-decoration:underline;text-underline-offset:3px;margin-left:12px;padding:2px 4px}
.inspector h3{margin:0 0 1px;font-family:var(--font-display);font-size:16px;line-height:1.2;text-wrap:balance}
.insp-head{display:flex;gap:9px;align-items:flex-start}
.insp-head .swatch{width:32px;height:32px;border-radius:9px}
.close{margin-left:auto;border:0;background:none;padding:4px;border-radius:8px;color:var(--muted)}
.close svg{width:18px;height:18px}

.panel{border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0;background:var(--panel)}
.handle{display:none}
.tabs{display:flex;border-bottom:1px solid var(--line);flex:none}
.tab{flex:1;border:0;background:none;padding:8px 4px 7px;font-size:12.5px;font-weight:700;color:var(--muted);border-bottom:3px solid transparent;display:flex;flex-direction:column;align-items:center;gap:2px}
.tab svg{width:17px;height:17px}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tabbody{overflow:auto;flex:1;padding:10px 12px 20px;min-height:0;overscroll-behavior:contain}
.tabbody[hidden]{display:none}
h2{font-family:var(--font-display);font-weight:800;font-size:18px;letter-spacing:-.01em;margin:0 0 2px;text-wrap:balance}
h4{font-family:var(--font-display);font-weight:600;font-size:14.5px;margin:14px 0 6px}
.tabbody>h4:first-child{margin-top:4px}
.sub{color:var(--muted);font-size:12.5px;margin:0 0 8px}
.search{display:flex;align-items:center;gap:7px;border:1px solid var(--line);border-radius:10px;padding:6px 9px;background:var(--paper);flex:1;min-width:0;transition:border-color .16s}
.search:focus-within{border-color:var(--accent)}
.searchrow{display:flex;gap:6px;align-items:center}
.search input{border:0;background:none;outline:none;flex:1;min-width:0}
.search svg{width:17px;height:17px;color:var(--muted);flex:none}
.cats{display:flex;gap:5px;overflow-x:auto;padding:8px 0 6px;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.cat{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:4px 10px;font-size:12.5px;white-space:nowrap;flex:none}
.cat[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.cat .n{color:var(--muted);font-size:11px;margin-left:4px}
.cat[aria-pressed="true"] .n{color:inherit;opacity:.7}
.list{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:9px;padding:5px 6px;border-radius:10px;border:1px solid transparent;text-align:left;background:none;width:100%}
.row:hover{background:color-mix(in srgb,var(--ink) 5%,transparent)}
.row[aria-pressed="true"]{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 45%,transparent)}
.row .swatch{width:28px;height:28px;border-radius:8px}
img.swatch{display:block;object-fit:cover}
.row .meta{min-width:0;flex:1}
.row .nm{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .ds{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.info{border:0;background:none;color:var(--muted);padding:5px;border-radius:8px;flex:none}
.info svg{width:17px;height:17px}
.ep{font-size:10.5px;font-weight:700;letter-spacing:.04em;border-radius:5px;padding:1px 5px;background:color-mix(in srgb,var(--accent) 18%,transparent);color:var(--accent);vertical-align:1px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(72px,1fr));gap:6px;margin:2px 0 4px}
.tile{border:1px solid var(--line);border-radius:10px;padding:6px 9px;background:var(--paper);min-width:0}
.tile .k{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .v{font-family:var(--font-display);font-weight:800;font-size:19px;line-height:1.2;font-variant-numeric:tabular-nums;white-space:nowrap}
.tile .v small{font-size:12px;color:var(--muted);font-weight:600}
table.mats{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:13.5px}
table.mats th{font-size:11.5px;color:var(--muted);font-weight:700;text-align:right;padding:5px 4px;border-bottom:1px solid var(--line)}
table.mats th:first-child{text-align:left}
table.mats td{padding:4px;border-bottom:1px solid color-mix(in srgb,var(--line) 70%,transparent);text-align:right}
table.mats td:first-child{text-align:left}
table.mats input{width:62px;text-align:right;border:1px solid var(--line);border-radius:8px;padding:3px 6px;background:var(--paper)}
.left0{color:var(--good);font-weight:700}
.leftn{color:var(--ink);font-weight:700}
.reqs{display:flex;flex-wrap:wrap;gap:4px;margin:5px 0}
.req{display:inline-flex;align-items:center;gap:4px;font-size:12px;border-radius:7px;padding:2px 7px;background:var(--paper);border:1px solid var(--line)}
button.req.kind{font:inherit;font-size:12px;color:var(--ink);cursor:pointer;padding:2px 7px 2px 3px}button.req.kind:hover{border-color:var(--accent)}button.req.kind .swatch{width:20px;height:20px;border-radius:5px}
.req b{font-variant-numeric:tabular-nums}
.req.ok{border-color:color-mix(in srgb,var(--good) 45%,var(--line));background:color-mix(in srgb,var(--good) 10%,var(--paper))}
.req.miss{border-color:color-mix(in srgb,var(--bad) 40%,var(--line));background:color-mix(in srgb,var(--bad) 8%,var(--paper))}
.card{border:1px solid var(--line);border-radius:12px;padding:8px 10px;margin:0 0 6px;background:var(--panel)}
.card.zone-ok{border-left:4px solid var(--good)}
.card.zone-part{border-left:4px solid var(--warn)}
.card.zone-none{border-left:4px solid var(--line)}

<div class="app">
  <header class="top">
    <div class="brand">
      <svg width="30" height="30" viewBox="0 0 30 30" aria-hidden="true"><path d="M15 2 27 8.5v13L15 28 3 21.5v-13z" fill="var(--accent)"/><path d="M3 8.5 15 15l12-6.5M15 15v13" fill="none" stroke="var(--panel)" stroke-width="1.6" opacity=".8"/><path d="M8 6 15 2l7 4-7 4z" fill="#7fbf5f"/></svg>
      <h1>Pokopia <span>Area Planner</span></h1>
    </div>
    <div class="planpick">
      <span class="planname" id="hdrPlan">Loading…</span>
      <span class="chip hide-sm" id="hdrArea">—</span>
      <span class="chip" id="saveChip" role="status"><span class="dot"></span><span>Starting</span></span>
      <button class="iconbtn fsbtn" id="fsBtn" data-tip="Full screen" aria-label="Full screen" hidden><svg><use href="#i-expand"/></svg></button>
      <button class="iconbtn fsbtn" id="setBtn" data-tip="Settings" aria-label="Settings"><svg><use href="#i-gear"/></svg></button>
    </div>
  </header>

  <nav class="toolbar" aria-label="Tools">
    <button class="tbtn" data-tool="pan" aria-pressed="true" data-tip="Pan (H)"><svg><use href="#i-hand"/></svg>Pan</button>
    <button class="tbtn" data-tool="place" aria-pressed="false" data-tip="Place (B)"><svg><use href="#i-brush"/></svg>Place</button>
    <button class="tbtn" data-tool="rect" aria-pressed="false" data-tip="Fill area (R)"><svg><use href="#i-rect"/></svg>Fill</button>
    <button class="tbtn" data-tool="erase" aria-pressed="false" data-tip="Erase (E)"><svg><use href="#i-erase"/></svg>Erase</button>
    <button class="tbtn" data-tool="select" aria-pressed="false" data-tip="Select (V)"><svg><use href="#i-select"/></svg>Select</button>
    <button class="tbtn" data-tool="zone" aria-pressed="false" data-tip="Zone (Z)"><svg><use href="#i-zone"/></svg>Zone</button>
    <button class="tbtn" data-tool="pick" aria-pressed="false" data-tip="Pick item (I)"><svg><use href="#i-pick"/></svg>Pick</button>
    <span class="sep"></span>
    <button class="tbtn icononly" id="undoBtn" aria-label="Undo" data-tip="Undo (Ctrl+Z)" disabled><svg><use href="#i-undo"/></svg></button>
    <button class="tbtn icononly" id="redoBtn" aria-label="Redo" data-tip="Redo (Ctrl+Y)" disabled><svg><use href="#i-redo"/></svg></button>
  </nav>

  <div class="main">
    <div class="mapwrap" id="mapwrap">
      <canvas id="map3d" hidden aria-hidden="true"></canvas>
      <canvas id="map" aria-label="Area map. Use the tools above to paint terrain, place items and draw habitat zones."></canvas>
      <div class="optbar" id="optbar"></div>
      <div class="status" id="status"></div>
      <div class="zoomctl">
        <button class="iconbtn" id="zlayers" aria-label="Layers (L)" data-tip="Layers (L)"><svg><use href="#i-layers"/></svg></button>
        <span class="sysw"><button class="iconbtn" id="zsys" aria-pressed="false" aria-expanded="false" aria-haspopup="true" aria-controls="sysmenu" aria-label="Show on the map (S)" data-tip="Show on the map (S)"><svg><use href="#i-sys"/></svg></button><div class="sysmenu" id="sysmenu" role="menu" aria-label="Show on the map" hidden></div></span>
        <button class="iconbtn" id="zturn" hidden aria-label="Turn the view (. or ,)" data-tip="Turn the view (. or ,)"><svg><use href="#i-rotate"/></svg></button>
        <button class="iconbtn" id="ztilt" hidden aria-pressed="false" aria-label="Tilt (T)" data-tip="Tilt (T)"><svg><use href="#i-tilt"/></svg></button>
        <button class="iconbtn" id="zin" aria-label="Zoom in" data-tip="Zoom in"><svg><use href="#i-plus"/></svg></button>
        <button class="iconbtn" id="zout" aria-label="Zoom out" data-tip="Zoom out"><svg><use href="#i-minus"/></svg></button>
        <button class="iconbtn" id="zfit" aria-label="Fit plan on screen" data-tip="Fit on screen"><svg><use href="#i-fit"/></svg></button>
      </div>
      <div class="inspector" id="inspector" role="dialog" aria-label="Selection details"></div>
      <div class="minidlg" id="minidlg" hidden></div>
    </div>

    <aside class="panel" id="panel">
      <button class="handle" id="handle" aria-label="Resize panel"></button>
      <div class="tabs" role="tablist">
        <button class="tab" role="tab" data-tab="build" aria-selected="true"><svg><use href="#i-cube"/></svg>Build</button>
        <button class="tab" role="tab" data-tab="layers" aria-selected="false"><svg><use href="#i-layers"/></svg>Layers</button>
        <button class="tab" role="tab" data-tab="materials" aria-selected="false"><svg><use href="#i-list"/></svg>Materials</button>
        <button class="tab" role="tab" data-tab="habitats" aria-selected="false"><svg><use href="#i-leaf"/></svg>Habitats</button>
        <button class="tab" role="tab" data-tab="pokemon" aria-selected="false"><svg><use href="#i-ball"/></svg>Pokémon</button>
        <button class="tab" role="tab" data-tab="plans" aria-selected="false"><svg><use href="#i-map"/></svg>Plans</button>
      </div>
      <section class="tabbody" id="tab-build" role="tabpanel"></section>
      <section class="tabbody" id="tab-layers" role="tabpanel" hidden></section>
      <section class="tabbody" id="tab-materials" role="tabpanel" hidden></section>
      <section class="tabbody" id="tab-habitats" role="tabpanel" hidden></section>
      <section class="tabbody" id="tab-pokemon" role="tabpanel" hidden></section>
      <section class="tabbody" id="tab-plans" role="tabpanel" hidden></section>
    </aside>
  </div>
</div>
<div class="ied" id="ied" hidden></div>
<div class="sets" id="sets" hidden></div>
<div class="toasts" id="toasts" role="status" aria-live="polite"></div>
<div class="modal" id="modal"><div class="box" id="modalBox" role="dialog" aria-modal="true"></div></div>

<script>{ const s = document.createElement('script'); s.src = 'app.js?v=' + encodeURIComponent(APP_BUILD); s.async = false; document.body.append(s); }</script>
</body>
</html>
